name: Build and deploy ASP.Net Core app to Azure Web App - ecologymuebles-api

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Restore
        run: dotnet restore CatalogoMueblesAPI/CatalogoMueblesAPI.csproj

      - name: Build
        run: dotnet build CatalogoMueblesAPI/CatalogoMueblesAPI.csproj -c Release --no-restore

      - name: Publish
        run: dotnet publish CatalogoMueblesAPI/CatalogoMueblesAPI.csproj -c Release -o publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: api
          path: publish

  deploy:
    needs: build
    runs-on: windows-latest

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: api

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ecologymuebles-api
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE }}
          package: .